name: test

on:
  push:
    paths:
      - '@psp-asia/layout/**'
  pull_request:

jobs:
  layout-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: @psp-asia/layout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
